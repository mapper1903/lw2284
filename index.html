<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Savaş Alanı Haritası</title>
<style>
  :root { --bg:#1f2226; --panel:#262a2f; --line:#363b42; --fg:#e8eaed; --dim:#9aa0a6; --acc:#3fa9f5; --red:#ff3b30; --yel:#ffd60a; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.35 "Segoe UI", system-ui, sans-serif; }
  button, input, select { font:inherit; color:var(--fg); background:#2f343a; border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  button { cursor:pointer; }
  button:active { background:#3a4048; }
  button.pri { background:var(--acc); border-color:var(--acc); color:#06121c; font-weight:600; }
  input[type=number] { width:64px; }
  #login { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:16px; }
  #login .box { width:100%; max-width:340px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:22px; }
  #login h1 { font-size:20px; margin:0 0 14px; }
  #login input[type=password] { width:100%; margin:6px 0 10px; padding:10px; }
  #login .err { color:var(--red); min-height:20px; margin-top:8px; }
  #app { display:none; height:100%; }
  #side { width:380px; height:100%; overflow:auto; padding:12px; border-right:1px solid var(--line); }
  #mapwrap { position:relative; flex:1; height:100%; min-height:300px; overflow:hidden; touch-action:none; background:#15171a; }
  #cv { position:absolute; inset:0; width:100%; height:100%; }
  .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:6px 0; }
  .lbl { color:var(--dim); font-size:12px; }
  #q { width:100%; padding:10px; font-size:15px; }
  #info { color:var(--dim); font-size:12px; margin:4px 0; }
  #list { margin-top:6px; border-top:1px solid var(--line); }
  .it { display:grid; grid-template-columns:1fr 34px 76px 72px; gap:4px; padding:7px 4px; border-bottom:1px solid var(--line); cursor:pointer; font-size:13px; }
  .it:hover { background:#2b3036; }
  .it.sel { background:#3a2326; }
  .it.miss { color:var(--dim); }
  .it .nm { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .it .tg { color:var(--acc); }
  .it .ag { color:var(--dim); text-align:right; }
  details { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 10px; margin:8px 0; }
  summary { cursor:pointer; font-weight:600; }
  #hdr { display:flex; justify-content:space-between; align-items:center; gap:6px; }
  #hdr h2 { font-size:16px; margin:0; }
  #upd { color:var(--dim); font-size:12px; }
  #pick { position:absolute; left:50%; top:10px; transform:translateX(-50%); background:var(--yel); color:#111; padding:6px 12px; border-radius:16px; display:none; font-weight:600; }
  #zoom { position:absolute; right:10px; bottom:10px; display:flex; flex-direction:column; gap:6px; }
  #zoom button { width:40px; height:40px; font-size:20px; padding:0; }
  @media (max-width: 800px) {
    #app { flex-direction:column; height:auto; }
    #side { width:100%; height:auto; border-right:none; }
    #mapwrap { width:100%; height:62vh; flex:none; order:-1; }
  }
</style>
</head>
<body>
<div id="login">
  <div class="box">
    <h1>Savaş Alanı Haritası</h1>
    <div class="lbl">Şifre</div>
    <input id="pw" type="password" autocomplete="current-password">
    <label class="lbl"><input id="remember" type="checkbox" checked> Bu cihazda hatırla</label>
    <div class="row" style="margin-top:12px"><button class="pri" id="go" style="width:100%">Aç</button></div>
    <div class="err" id="lerr"></div>
  </div>
</div>

<div id="app">
  <div id="side">
    <div id="hdr"><h2 id="title">Savaş Alanı</h2>
      <div><button id="refresh" title="Yenile">⟳</button> <button id="logout" title="Çıkış">Çıkış</button></div></div>
    <div id="upd"></div>
    <div class="row"><input id="q" placeholder="Oyuncu adı ya da [ETİKET]" autocomplete="off"></div>
    <details id="fbox">
      <summary>Filtreler</summary>
      <div class="row"><span class="lbl">Seviye</span><input id="lvmin" type="number" inputmode="numeric" placeholder="en az">
        <span>–</span><input id="lvmax" type="number" inputmode="numeric" placeholder="en çok"></div>
      <div class="row"><span class="lbl">İttifak</span>
        <select id="ally"><option value="all">Hepsi</option><option value="none">İttifaksız</option><option value="tag">Etiket:</option></select>
        <input id="tag" placeholder="ör. RE4L" style="width:90px"></div>
      <div class="row"><span class="lbl">Görülme</span>
        <select id="seen"><option value="0">Hepsi</option><option value="1">Son 1 saat</option><option value="6">Son 6 saat</option>
          <option value="24">Son 24 saat</option><option value="72">Son 3 gün</option></select></div>
      <div class="row"><span class="lbl">Uzaklık merkezi</span> X <input id="cx" type="number" inputmode="numeric">
        Y <input id="cy" type="number" inputmode="numeric"></div>
      <div class="row"><span class="lbl">En çok</span><input id="dist" type="number" inputmode="numeric"> <span class="lbl">birim</span></div>
      <div class="row"><button id="cHome">Benim üssüm</button><button id="cSel">Seçili oyuncu</button><button id="cPick">Haritadan seç</button></div>
      <div class="row"><input id="cName" placeholder="Bir oyuncunun adı" style="flex:1"><button id="cFind">Merkez yap</button></div>
      <div class="row"><button id="clear">Filtreleri temizle</button></div>
    </details>
    <div id="info"></div>
    <div id="list"></div>
  </div>
  <div id="mapwrap">
    <canvas id="cv"></canvas>
    <div id="pick">Merkez için haritaya dokun</div>
    <div id="zoom"><button id="zin">+</button><button id="zout">−</button><button id="zres" style="font-size:13px">Tüm</button></div>
  </div>
</div>

<script>
"use strict";
const OWNER = "mapper1903", REPO = "lw2284";
const $ = id => document.getElementById(id);
const LS = { get(k){ try { return localStorage.getItem(k); } catch(e) { return null; } },
             set(k,v){ try { localStorage.setItem(k,v); } catch(e) {} },
             del(k){ try { localStorage.removeItem(k); } catch(e) {} } };
let PW = null, KEYC = null, DATA = null, players = [], filtered = [], selected = null, picking = false;

// ---------------------------------------------------------------- veri
async function fetchBlob() {
  let url = null;
  try {
    const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/ref/heads/veri`, {cache:"no-store"});
    if (r.ok) { const j = await r.json(); url = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${j.object.sha}/data.bin`; }
  } catch(e) {}
  if (!url) url = `https://raw.githubusercontent.com/${OWNER}/${REPO}/veri/data.bin?t=${Date.now()}`;
  const r = await fetch(url, {cache:"no-store"});
  if (!r.ok) throw new Error("Veri indirilemedi (" + r.status + ")");
  return new Uint8Array(await r.arrayBuffer());
}
const hex = b => Array.from(b).map(x => x.toString(16).padStart(2,"0")).join("");
async function decrypt(pw, b) {
  if (String.fromCharCode(...b.slice(0,4)) !== "LWH1") throw new Error("Veri biçimi tanınmadı");
  const salt = b.slice(4,20), it = new DataView(b.buffer, b.byteOffset+20, 4).getUint32(0), iv = b.slice(24,36), ct = b.slice(36);
  const sig = hex(salt) + ":" + it + ":" + pw;
  if (!KEYC || KEYC.sig !== sig) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:it, hash:"SHA-256"}, base,
                                              {name:"AES-GCM", length:256}, false, ["decrypt"]);
    KEYC = {sig, key};
  }
  let pt;
  try { pt = await crypto.subtle.decrypt({name:"AES-GCM", iv}, KEYC.key, ct); }
  catch(e) { KEYC = null; const err = new Error("Şifre yanlış"); err.badpw = true; throw err; }
  const txt = await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  return JSON.parse(txt);
}
async function load(pw) {
  const d = await decrypt(pw, await fetchBlob());
  DATA = d;
  players = d.p.map(a => ({name:a[0], tag:a[1], x:a[2], y:a[3], level:a[4] || null, seen:a[5], miss:a[6] || 0}));
  $("title").textContent = "Savaş Alanı #" + d.sunucu;
  updText();
}
function updText() {
  if (!DATA) return;
  $("upd").textContent = `Son güncelleme: ${age(DATA.t)} · ${players.length} oyuncu`;
}

// ---------------------------------------------------------------- giriş
async function login(pw, silent) {
  $("lerr").textContent = silent ? "" : "Açılıyor...";
  try {
    await load(pw);
    PW = pw;
    if ($("remember").checked) LS.set("lw_pw", pw); else LS.del("lw_pw");
    $("login").style.display = "none";
    $("app").style.display = "flex";
    restoreFilters();
    resize(); resetView(); apply();
  } catch(e) {
    $("lerr").textContent = e.message || String(e);
    if (e.badpw) LS.del("lw_pw");
  }
}
$("go").onclick = () => login($("pw").value);
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") login($("pw").value); });
$("logout").onclick = () => { LS.del("lw_pw"); location.reload(); };
$("refresh").onclick = async () => {
  $("upd").textContent = "Yenileniyor...";
  try { await load(PW); apply(); } catch(e) { $("upd").textContent = "Yenilenemedi: " + e.message; }
};
setInterval(async () => { if (PW) { try { await load(PW); apply(); } catch(e) {} } }, 5*60*1000);
setInterval(updText, 30*1000);

// ---------------------------------------------------------------- filtreler
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : null; };
const FKEYS = ["q","lvmin","lvmax","ally","tag","seen","cx","cy","dist"];
function saveFilters() { const o = {}; FKEYS.forEach(k => o[k] = $(k).value); LS.set("lw_f", JSON.stringify(o)); }
function restoreFilters() {
  try { const o = JSON.parse(LS.get("lw_f") || "{}"); FKEYS.forEach(k => { if (o[k] != null) $(k).value = o[k]; }); } catch(e) {}
  if ($("cx").value === "" && $("cy").value === "") centerHome(true);
}
function readF() {
  const f = {}, lo = num($("lvmin").value), hi = num($("lvmax").value);
  if (lo !== null) f.lvmin = lo;
  if (hi !== null) f.lvmax = hi;
  const a = $("ally").value;
  if (a === "none") f.ally = "";
  else if (a === "tag" && $("tag").value.trim()) f.ally = $("tag").value.trim().replace(/[\[\]]/g, "").toUpperCase();
  const h = num($("seen").value);
  if (h) f.seen = Date.now()/1000 - h*3600;
  const cx = num($("cx").value), cy = num($("cy").value), d = num($("dist").value);
  if (cx !== null && cy !== null && d !== null) f.dist = [cx, cy, d];
  return f;
}
function passes(r, f) {
  if (f.lvmin != null && (r.level == null || r.level < f.lvmin)) return false;
  if (f.lvmax != null && (r.level == null || r.level > f.lvmax)) return false;
  if (f.ally != null) { const t = (r.tag || "").toUpperCase(); if (f.ally === "" ? t !== "" : t !== f.ally) return false; }
  if (f.seen != null && r.seen < f.seen) return false;
  if (f.dist) { const [cx, cy, d] = f.dist; if (Math.hypot(r.x - cx, r.y - cy) > d) return false; }
  return true;
}
function matchQ(r, q) {
  if (!q) return true;
  q = q.toLowerCase().trim();
  const m = q.match(/^\[([^\]]*)\]?\s*(.*)$/);
  if (m) { const tg = m[1], rest = m[2];
    if (!(r.tag || "").toLowerCase().startsWith(tg)) return false;
    return !rest || r.name.toLowerCase().startsWith(rest); }
  const nm = r.name.toLowerCase(), tg = (r.tag || "").toLowerCase();
  return nm.startsWith(q) || nm.includes(q) || tg === q;
}
function apply() {
  const f = readF(), q = $("q").value;
  const anyF = Object.keys(f).length > 0;
  filtered = players.filter(r => passes(r, f));               // haritada gösterilenler
  const res = filtered.filter(r => matchQ(r, q)).sort((a, b) => b.seen - a.seen);
  const list = $("list"); list.textContent = "";
  res.slice(0, 300).forEach(r => {
    const d = document.createElement("div"); d.className = "it" + (r === selected ? " sel" : "") + (r.miss ? " miss" : "");
    if (r.miss) d.title = "Son tam turda yerinde görülmedi (taşınmış olabilir)";
    const nm = document.createElement("div"); nm.className = "nm";
    if (r.tag) { const t = document.createElement("span"); t.className = "tg"; t.textContent = "[" + r.tag + "]"; nm.appendChild(t); }
    nm.appendChild(document.createTextNode((r.miss ? "? " : "") + r.name));
    const lv = document.createElement("div"); lv.textContent = r.level || "-";
    const xy = document.createElement("div"); xy.textContent = Math.round(r.x) + ":" + Math.round(r.y);
    const ag = document.createElement("div"); ag.className = "ag"; ag.textContent = age(r.seen);
    d.append(nm, lv, xy, ag);
    d.onclick = () => select(r, true);
    list.appendChild(d);
  });
  $("info").textContent = (anyF || q) ? `${res.length} oyuncu uyuyor` + (res.length > 300 ? " (ilk 300 listede)" : "") : "";
  saveFilters();
  draw();
}
FKEYS.forEach(k => $(k).addEventListener("input", apply));
["ally","seen"].forEach(k => $(k).addEventListener("change", apply));
$("clear").onclick = () => { ["lvmin","lvmax","tag","dist"].forEach(k => $(k).value = ""); $("ally").value = "all"; $("seen").value = "0"; apply(); };
function setCenter(x, y, msg) { $("cx").value = Math.round(x); $("cy").value = Math.round(y); apply(); if (msg) $("info").textContent = msg; }
function findName(nm) {
  nm = (nm || "").trim().toLowerCase(); if (!nm) return null;
  let best = null;
  for (const r of players) if (r.name.toLowerCase() === nm && (!best || r.seen > best.seen)) best = r;
  if (!best) for (const r of players) if (r.name.toLowerCase().startsWith(nm) && (!best || r.seen > best.seen)) best = r;
  return best;
}
function centerHome(quiet) {
  const r = findName(DATA && DATA.ev_ad);
  if (r) setCenter(r.x, r.y, quiet ? "" : `Merkez: üssün ${Math.round(r.x)}:${Math.round(r.y)} (${age(r.seen)})`);
  else if (!quiet) $("info").textContent = "Üssün henüz taranmadı";
}
$("cHome").onclick = () => centerHome(false);
$("cSel").onclick = () => { if (selected) setCenter(selected.x, selected.y, "Merkez: " + selected.name); else $("info").textContent = "Önce bir oyuncu seç"; };
$("cFind").onclick = () => { const r = findName($("cName").value); if (r) { setCenter(r.x, r.y, "Merkez: " + r.name); select(r, true); } else $("info").textContent = "Bu adla oyuncu bulunamadı"; };
$("cPick").onclick = () => { picking = !picking; $("pick").style.display = picking ? "block" : "none"; };

function age(t) {
  const s = Date.now()/1000 - t;
  if (s < 90) return "az önce";
  if (s < 3600) return Math.round(s/60) + " dk önce";
  if (s < 86400) return Math.round(s/3600) + " sa önce";
  return Math.round(s/86400) + " gün önce";
}

// ---------------------------------------------------------------- harita
const cv = $("cv"), ctx = cv.getContext("2d"), img = new Image();
img.src = "harita.jpg?v=3"; img.onload = () => draw();
let W = 0, H = 0, dpr = 1, view = {cx:500, cy:500, ppu:1};  // ppu: piksel / birim (yatay)
const ASP = 1478/1880;   // harita resminin oranı (birim başına dikey/yatay)
function resize() {
  const r = $("mapwrap").getBoundingClientRect();
  dpr = window.devicePixelRatio || 1; W = r.width; H = r.height;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  draw();
}
window.addEventListener("resize", resize);
function minPpu() { return Math.min(W/1000, H/(1000*ASP)); }
function resetView() { view = {cx:500, cy:500, ppu:minPpu()}; draw(); }
function clampView() {
  view.ppu = Math.max(minPpu(), Math.min(view.ppu, 60));
  const hw = W/2/view.ppu, hh = H/2/(view.ppu*ASP);
  view.cx = hw >= 500 ? 500 : Math.max(hw, Math.min(1000-hw, view.cx));
  view.cy = hh >= 500 ? 500 : Math.max(hh, Math.min(1000-hh, view.cy));
}
const m2c = (x, y) => [W/2 + (x - view.cx)*view.ppu, H/2 - (y - view.cy)*view.ppu*ASP];
const c2m = (a, b) => [view.cx + (a - W/2)/view.ppu, view.cy - (b - H/2)/(view.ppu*ASP)];
function draw() {
  if (!W) return;
  clampView();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle = "#15171a"; ctx.fillRect(0,0,W,H);
  const [a0, b0] = m2c(0, 1000), [a1, b1] = m2c(1000, 0);
  if (img.complete && img.naturalWidth) ctx.drawImage(img, a0, b0, a1-a0, b1-b0);
  const sel = new Set(), q = $("q").value;
  const big = view.ppu > 6, rad = big ? 4 : 2.2;
  for (const r of filtered) {
    const [a, b] = m2c(r.x, r.y);
    if (a < -10 || b < -10 || a > W+10 || b > H+10) continue;
    const hit = q && matchQ(r, q);
    ctx.fillStyle = hit ? "#ffd60a" : (r.miss ? "#8e8e93" : "#ff3b30");
    ctx.beginPath(); ctx.arc(a, b, hit ? rad+1.5 : rad, 0, 7); ctx.fill();
    if (big) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 1; ctx.stroke(); }
  }
  if (view.ppu > 9) {
    ctx.font = "12px Segoe UI, sans-serif"; ctx.textAlign = "center";
    for (const r of filtered) {
      const [a, b] = m2c(r.x, r.y);
      if (a < -60 || b < -20 || a > W+60 || b > H+20) continue;
      const t = (r.tag ? "[" + r.tag + "]" : "") + r.name;
      ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,.75)"; ctx.strokeText(t, a, b - 8);
      ctx.fillStyle = "#fff"; ctx.fillText(t, a, b - 8);
    }
  }
  const cx = num($("cx").value), cy = num($("cy").value);
  if (cx !== null && cy !== null) {
    const [a, b] = m2c(cx, cy);
    ctx.strokeStyle = "#ffd60a"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(a-9,b); ctx.lineTo(a+9,b); ctx.moveTo(a,b-9); ctx.lineTo(a,b+9); ctx.stroke();
    const d = num($("dist").value);
    if (d) { ctx.setLineDash([6,4]); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(a, b, d*view.ppu, d*view.ppu*ASP, 0, 0, 7); ctx.stroke(); ctx.setLineDash([]); }
  }
  if (selected) {
    const [a, b] = m2c(selected.x, selected.y);
    ctx.strokeStyle = "#ff3b30"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(a, b, 13, 0, 7); ctx.stroke();
    const t = `${selected.tag ? "[" + selected.tag + "]" : ""}${selected.name}  ${Math.round(selected.x)}:${Math.round(selected.y)}` + (selected.level ? `  Sv ${selected.level}` : "");
    ctx.font = "bold 13px Segoe UI, sans-serif"; ctx.textAlign = a < W - 220 ? "left" : "right";
    const tx = a < W - 220 ? a + 17 : a - 17;
    ctx.lineWidth = 4; ctx.strokeStyle = "rgba(0,0,0,.8)"; ctx.strokeText(t, tx, b - 14);
    ctx.fillStyle = "#fff"; ctx.fillText(t, tx, b - 14);
  }
  // koordinat cetveli
  ctx.fillStyle = "rgba(255,255,255,.7)"; ctx.font = "11px Segoe UI, sans-serif"; ctx.textAlign = "left";
  const [vx, vy] = c2m(W/2, H/2);
  ctx.fillText(`${Math.round(vx)}:${Math.round(vy)}`, 8, H - 8);
}
function select(r, focus) {
  selected = r;
  if (focus) { view.cx = r.x; view.cy = r.y; view.ppu = Math.max(view.ppu, 12); }
  apply();
  if (window.innerWidth <= 800 && focus) $("mapwrap").scrollIntoView({behavior:"smooth"});
}
function zoomAt(a, b, k) {
  const [mx, my] = c2m(a, b);
  view.ppu *= k; clampView();
  const [nx, ny] = c2m(a, b);
  view.cx += mx - nx; view.cy += my - ny; draw();
}
$("zin").onclick = () => zoomAt(W/2, H/2, 1.6);
$("zout").onclick = () => zoomAt(W/2, H/2, 1/1.6);
$("zres").onclick = resetView;
cv.addEventListener("wheel", e => { e.preventDefault(); const r = cv.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.25 : 0.8); }, {passive:false});
const ptrs = new Map(); let moved = 0, pinch0 = null;
cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; pinch0 = null; });
cv.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 1) {
    const dx = e.clientX - prev[0], dy = e.clientY - prev[1]; moved += Math.abs(dx) + Math.abs(dy);
    view.cx -= dx/view.ppu; view.cy += dy/(view.ppu*ASP); draw();
  } else if (ptrs.size === 2) {
    const [p, q] = [...ptrs.values()], d = Math.hypot(p[0]-q[0], p[1]-q[1]);
    const r = cv.getBoundingClientRect();
    if (pinch0) zoomAt((p[0]+q[0])/2 - r.left, (p[1]+q[1])/2 - r.top, d/pinch0);
    pinch0 = d; moved = 99;
  }
});
function up(e) {
  if (ptrs.size === 1 && moved < 8) {
    const r = cv.getBoundingClientRect(), a = e.clientX - r.left, b = e.clientY - r.top;
    if (picking) { const [x, y] = c2m(a, b); picking = false; $("pick").style.display = "none"; setCenter(x, y, `Merkez: ${Math.round(x)}:${Math.round(y)}`); }
    else {
      let best = null, bd = 18;
      for (const p of filtered) { const [pa, pb] = m2c(p.x, p.y), d = Math.hypot(pa-a, pb-b); if (d < bd) { bd = d; best = p; } }
      if (best) select(best, false);
    }
  }
  ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = null;
}
cv.addEventListener("pointerup", up);
cv.addEventListener("pointercancel", e => { ptrs.delete(e.pointerId); pinch0 = null; });

// ---------------------------------------------------------------- başlangıç
const saved = LS.get("lw_pw");
if (saved) { $("pw").value = saved; login(saved, true); }
</script>
